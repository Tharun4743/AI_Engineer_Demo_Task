[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-pipeline"
version = "1.0.0"
description = "Autonomous AI Competitive Intelligence Data Collection and Extraction Pipeline"
authors = [{ name = "AI Systems Architect" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiohttp>=3.9.0",
    "curl_cffi>=0.7.0",
    "trafilatura>=2.0.0",
    "feedparser>=6.0.0",
    "gspread>=6.0.0",
    "tenacity>=8.2.0",
    "fpdf2>=2.8.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0.0",
    "tiktoken>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
